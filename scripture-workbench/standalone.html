<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scripture Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;600&family=Frank+Ruhl+Libre:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Scripture Workbench

   Direction: a reading instrument, not a devotional app. The reference points
   are a laboratory notebook and a technical terminal rather than a printed
   Bible — this is a workbench where evidence is examined, so the surface is
   dark and the type is the illuminated element.

   Three accents, each carrying a distinct class of information and nothing
   else. They are structural, not decorative:
     verdigris  lexical   — a word carries Strong's data and can be opened
     rubric     textual   — the editions disagree here
     amber      editorial — your own work is anchored here
   ========================================================================== */

:root {
  /* ground */
  --ink-900: #0e171c;
  --ink-850: #121e24;
  --ink-800: #17262d;
  --ink-700: #1e323a;
  --ink-600: #26414a;
  --rule:    #2b4650;
  --rule-soft: #1f353d;

  /* type */
  --text:   #e4dfd2;
  --text-2: #9db0b7;
  --text-3: #61787f;

  /* accents — one job each */
  --verdigris: #74b3a5;
  --verdigris-dim: #3d6a63;
  --rubric: #cd6b55;
  --amber: #d7a548;

  /* faces */
  --scripture: 'EB Garamond', 'Cardo', Georgia, serif;
  --hebrew: 'Frank Ruhl Libre', 'EB Garamond', serif;
  --ui: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif;
  --code: 'IBM Plex Mono', ui-monospace, monospace;

  --rail: 13.5rem;
  --ease: cubic-bezier(.22,.61,.36,1);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%; margin: 0;
  background: var(--ink-900);
  color: var(--text);
  font-family: var(--ui);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}

:focus-visible {
  outline: 2px solid var(--verdigris);
  outline-offset: 2px;
  border-radius: 2px;
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

/* --- shared label style --------------------------------------------------- */

.label {
  font-family: var(--ui);
  font-size: .625rem;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--text-3);
}

/* --- shell ---------------------------------------------------------------- */

.shell {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1.15fr) minmax(0, .85fr) minmax(0, .85fr);
  height: 100vh;
}

.pane {
  min-width: 0;
  overflow-y: auto;
  border-left: 1px solid var(--rule-soft);
  scrollbar-width: thin;
  scrollbar-color: var(--ink-600) transparent;
}
.pane::-webkit-scrollbar { width: 9px; }
.pane::-webkit-scrollbar-thumb { background: var(--ink-600); border-radius: 9px; }
.pane::-webkit-scrollbar-track { background: transparent; }

.pane-head {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: baseline; gap: .6rem;
  padding: .85rem 1.1rem .7rem;
  background: linear-gradient(var(--ink-900) 72%, transparent);
  border-bottom: 1px solid var(--rule-soft);
}
.pane-head .count {
  font-family: var(--code); font-size: .625rem; color: var(--text-3);
  margin-left: auto;
}

/* --- rail ----------------------------------------------------------------- */

.rail { background: var(--ink-850); border-left: none; padding-bottom: 2rem; }

.brand { padding: 1.15rem 1.1rem .9rem; border-bottom: 1px solid var(--rule-soft); }
.brand h1 {
  margin: 0; font-family: var(--scripture);
  font-size: 1.32rem; font-weight: 500; letter-spacing: .005em; line-height: 1.15;
}
.brand .sub {
  margin-top: .3rem; font-family: var(--code);
  font-size: .6rem; letter-spacing: .05em; color: var(--verdigris-dim);
}

.rail-section { padding: 1rem 1.1rem .3rem; }

.passage-list { list-style: none; margin: .5rem 0 0; padding: 0; }
.passage-list button {
  display: block; width: 100%; text-align: left;
  padding: .45rem .55rem; margin-bottom: .15rem;
  border-radius: 3px; border-left: 2px solid transparent;
  color: var(--text-2); font-size: .82rem; line-height: 1.3;
  transition: background .12s var(--ease), color .12s var(--ease);
}
.passage-list button:hover { background: var(--ink-800); color: var(--text); }
.passage-list button[aria-current="true"] {
  background: var(--ink-800); color: var(--text); border-left-color: var(--verdigris);
}
.passage-list .ref {
  display: block; font-family: var(--code);
  font-size: .6rem; color: var(--text-3); margin-top: .12rem;
}

.tag-cloud { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .55rem; }

.chip {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .2rem .5rem; border-radius: 999px;
  border: 1px solid var(--rule);
  font-size: .68rem; color: var(--text-2);
  transition: border-color .12s var(--ease), color .12s var(--ease);
}
.chip:hover { border-color: var(--verdigris-dim); color: var(--text); }
.chip[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
.chip .x { color: var(--text-3); font-size: .8rem; line-height: 1; }

.rail-note {
  margin: 1.2rem 1.1rem 0; padding: .6rem .7rem;
  border-left: 2px solid var(--amber);
  background: rgba(215,165,72,.06);
  font-size: .7rem; line-height: 1.5; color: var(--text-2);
}

/* --- text pane ------------------------------------------------------------ */

.text-pane { padding-bottom: 5rem; }

.version-bar {
  display: flex; gap: .3rem; padding: 0 1.1rem .7rem;
  border-bottom: 1px solid var(--rule-soft);
}
.version-bar button {
  padding: .22rem .55rem; border-radius: 3px;
  border: 1px solid transparent;
  font-family: var(--code); font-size: .62rem; letter-spacing: .06em;
  color: var(--text-3);
}
.version-bar button:hover { color: var(--text-2); }
.version-bar button[aria-pressed="true"] {
  color: var(--verdigris); border-color: var(--verdigris-dim);
  background: rgba(116,179,165,.07);
}
.version-bar button[disabled] { opacity: .35; cursor: not-allowed; }

.verse-block { border-bottom: 1px solid var(--rule-soft); }
.verse-block:last-child { border-bottom: none; }

.verse-row {
  display: grid; grid-template-columns: 2.6rem 1fr;
  padding: .9rem 1.1rem .3rem;
  transition: background .12s var(--ease);
}
.verse-block[aria-selected="true"] .verse-row { background: rgba(116,179,165,.05); }

.verse-num {
  font-family: var(--code); font-size: .68rem;
  color: var(--text-3); padding-top: .3rem;
  display: flex; align-items: flex-start; gap: .3rem;
}
.verse-num button { color: inherit; }
.verse-num button:hover { color: var(--verdigris); }
.anchor-mark {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--amber); margin-top: .58rem;
}

.verse-body { font-family: var(--scripture); }

.line-grc {
  font-size: 1.16rem; line-height: 1.95;
  margin-bottom: .35rem;
}
.line-eng {
  font-size: 1.02rem; line-height: 1.62; color: var(--text);
  margin-bottom: .3rem;
}
.line-eng .tr {
  font-family: var(--code); font-size: .58rem;
  letter-spacing: .07em; color: var(--text-3);
  margin-right: .5rem; vertical-align: .18em;
}
.line-eng.pending { color: var(--text-3); font-style: italic; }

.w {
  border-radius: 2px; padding: 0 .06em;
  border-bottom: 1px solid transparent;
  cursor: pointer;
  transition: color .1s var(--ease), border-color .1s var(--ease);
}
.w:hover { color: var(--verdigris); border-bottom-color: var(--verdigris-dim); }
.w[aria-pressed="true"] {
  color: var(--verdigris);
  border-bottom-color: var(--verdigris);
  background: rgba(116,179,165,.09);
}
.w.variant { border-bottom: 1px dotted var(--rubric); }
.w.variant::after {
  content: '\00b0'; color: var(--rubric);
  font-family: var(--code); font-size: .7em; vertical-align: .35em;
}

/* --- the word ribbon: signature element ----------------------------------- */

.ribbon {
  display: grid; grid-template-columns: 2.6rem 1fr;
  overflow: hidden;
  max-height: 0;
  transition: max-height .28s var(--ease);
}
.ribbon.open { max-height: 22rem; }
.ribbon-body {
  margin: 0 1.1rem .9rem 0;
  padding: .75rem .9rem;
  background: var(--ink-800);
  border-left: 2px solid var(--verdigris);
  border-radius: 0 3px 3px 0;
}

.ribbon-lemma {
  display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap;
  margin-bottom: .55rem;
}
.ribbon-lemma .lemma {
  font-family: var(--scripture); font-size: 1.28rem; color: var(--verdigris);
}
.ribbon-lemma .translit {
  font-family: var(--code); font-size: .68rem; color: var(--text-3);
}
.ribbon-lemma .strongs {
  margin-left: auto;
  font-family: var(--code); font-size: .64rem; letter-spacing: .06em;
  color: var(--text-2);
  padding: .12rem .4rem; border: 1px solid var(--rule); border-radius: 2px;
}
.ribbon-gloss {
  font-family: var(--scripture); font-size: .95rem;
  color: var(--text); margin-bottom: .65rem;
}

.parse { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: .65rem; }
.parse-chip {
  display: flex; flex-direction: column; gap: .1rem;
  padding: .25rem .45rem;
  background: var(--ink-700); border-radius: 2px;
  border-top: 1px solid var(--ink-600);
}
.parse-chip .k {
  font-family: var(--ui); font-size: .53rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text-3);
}
.parse-chip .v { font-family: var(--code); font-size: .7rem; color: var(--text); }

.apparatus { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; }
.apparatus .label { margin-right: .2rem; }
.ed {
  font-family: var(--code); font-size: .58rem; letter-spacing: .04em;
  padding: .1rem .32rem; border-radius: 2px;
  border: 1px solid var(--rule-soft); color: var(--text-3);
}
.ed.present { color: var(--text-2); border-color: var(--rule); }
.ed.absent { opacity: .3; text-decoration: line-through; }
.apparatus.split .label { color: var(--rubric); }

.ribbon-actions { display: flex; gap: .5rem; margin-top: .7rem; }
.mini {
  font-family: var(--ui); font-size: .66rem; letter-spacing: .04em;
  padding: .28rem .6rem; border-radius: 2px;
  border: 1px solid var(--rule); color: var(--text-2);
  transition: border-color .12s var(--ease), color .12s var(--ease);
}
.mini:hover { border-color: var(--verdigris-dim); color: var(--verdigris); }

/* --- exposition pane ------------------------------------------------------ */

.expo-section { padding: .9rem 1.1rem; border-bottom: 1px solid var(--rule-soft); }
.expo-section h3 { margin: 0 0 .55rem; }

.lex-full {
  font-family: var(--scripture); font-size: .95rem; line-height: 1.65;
  color: var(--text-2); margin: .5rem 0 0;
}
.lex-head { display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap; }
.lex-head .lemma { font-family: var(--scripture); font-size: 1.35rem; color: var(--text); }
.lex-head .translit { font-family: var(--code); font-size: .7rem; color: var(--text-3); }
.lex-head .pos {
  font-family: var(--ui); font-size: .6rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--verdigris-dim);
}
.lex-short {
  font-family: var(--scripture); font-size: 1.02rem;
  color: var(--verdigris); margin: .4rem 0 0;
}

.xref-list { list-style: none; margin: 0; padding: 0; }
.xref-list li { display: flex; align-items: center; gap: .55rem; padding: .28rem 0; }
.xref-list .ref {
  font-family: var(--scripture); font-size: .92rem; color: var(--text-2);
}
.xref-list li:hover .ref { color: var(--verdigris); }
.weight {
  margin-left: auto; height: 2px; border-radius: 2px;
  background: var(--verdigris-dim); min-width: 6px;
}

.occurrences { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .5rem; }
.occ {
  font-family: var(--code); font-size: .6rem;
  padding: .15rem .4rem; border-radius: 2px;
  background: var(--ink-800); color: var(--text-2);
}
.occ:hover { color: var(--verdigris); }

/* --- notes pane ----------------------------------------------------------- */

.notes-pane { padding-bottom: 4rem; }

.compose { padding: .9rem 1.1rem; border-bottom: 1px solid var(--rule-soft); }
.compose-target {
  font-family: var(--code); font-size: .62rem; letter-spacing: .05em;
  color: var(--amber); margin-bottom: .5rem;
}
.compose input, .compose textarea, .compose select {
  width: 100%; background: var(--ink-850);
  border: 1px solid var(--rule-soft); border-radius: 3px;
  color: var(--text); padding: .45rem .55rem; margin-bottom: .45rem;
  font-family: var(--ui); font-size: .82rem;
}
.compose textarea {
  font-family: var(--scripture); font-size: .95rem; line-height: 1.6;
  min-height: 6.5rem; resize: vertical;
}
.compose input::placeholder, .compose textarea::placeholder { color: var(--text-3); }
.compose input:focus, .compose textarea:focus, .compose select:focus {
  border-color: var(--verdigris-dim); outline: none;
}

.compose-row { display: flex; gap: .45rem; align-items: center; }
.btn {
  font-family: var(--ui); font-size: .72rem; letter-spacing: .04em;
  padding: .4rem .85rem; border-radius: 3px;
  background: var(--verdigris); color: var(--ink-900); font-weight: 600;
  transition: filter .12s var(--ease);
}
.btn:hover { filter: brightness(1.1); }
.btn.ghost {
  background: none; color: var(--text-3); font-weight: 400;
  border: 1px solid var(--rule);
}
.btn.ghost:hover { color: var(--text-2); border-color: var(--rule); filter: none; }

.note-card {
  padding: .8rem 1.1rem; border-bottom: 1px solid var(--rule-soft);
  border-left: 2px solid transparent;
  transition: border-color .12s var(--ease), background .12s var(--ease);
}
.note-card:hover { background: var(--ink-850); border-left-color: var(--amber); }
.note-card .meta {
  display: flex; align-items: center; gap: .5rem; margin-bottom: .35rem;
}
.note-type {
  font-family: var(--ui); font-size: .55rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--amber);
}
.note-card h4 {
  margin: 0 0 .3rem; font-family: var(--scripture);
  font-size: 1.05rem; font-weight: 500;
}
.note-card .body {
  font-family: var(--scripture); font-size: .92rem; line-height: 1.6;
  color: var(--text-2); white-space: pre-wrap;
}
.note-card .anchors {
  display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .5rem;
}
.anchor-pill {
  font-family: var(--code); font-size: .58rem;
  padding: .12rem .38rem; border-radius: 2px;
  background: rgba(215,165,72,.1); color: var(--amber);
}
.note-card .del {
  margin-left: auto; color: var(--text-3); font-size: .7rem; opacity: 0;
  transition: opacity .12s var(--ease);
}
.note-card:hover .del { opacity: 1; }
.note-card .del:hover { color: var(--rubric); }

/* --- empty states --------------------------------------------------------- */

.empty {
  padding: 1.6rem 1.1rem;
  font-size: .82rem; line-height: 1.6; color: var(--text-3);
}
.empty strong { display: block; color: var(--text-2); font-weight: 500; margin-bottom: .3rem; }

/* --- responsive ----------------------------------------------------------- */

@media (max-width: 1180px) {
  .shell { grid-template-columns: var(--rail) minmax(0,1fr) minmax(0,1fr); }
  .notes-pane { grid-column: 2 / -1; border-left: none; border-top: 1px solid var(--rule); }
}

@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; height: auto; }
  .pane { overflow-y: visible; border-left: none; border-top: 1px solid var(--rule-soft); }
  .rail { border-top: none; }
  .notes-pane { grid-column: auto; }
  body { height: auto; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  .ribbon { transition: none; }
}

/* ==========================================================================
   v0.2 — commentary, coverage, search
   ========================================================================== */

.workspace { display: contents; }
.three-pane { display: contents; }
.three-pane[hidden] { display: none; }

.wide { grid-column: 2 / -1; }
.wide[hidden] { display: none; }

/* --- mode navigation ------------------------------------------------------ */

.mode-nav {
  display: flex; flex-wrap: wrap; gap: .2rem;
  padding: .75rem .8rem; border-bottom: 1px solid var(--rule-soft);
}
.mode-nav button {
  padding: .3rem .55rem; border-radius: 3px;
  font-size: .74rem; color: var(--text-3);
  border: 1px solid transparent;
  transition: color .12s var(--ease), background .12s var(--ease);
}
.mode-nav button:hover { color: var(--text-2); background: var(--ink-800); }
.mode-nav button[aria-current="true"] {
  color: var(--verdigris); background: rgba(116,179,165,.08);
  border-color: var(--verdigris-dim);
}

.rail-stat {
  margin: 1.1rem 1.1rem 0; padding-top: .8rem;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--code); font-size: .62rem; line-height: 1.7;
  color: var(--text-3);
}
.rail-stat b { color: var(--verdigris); font-weight: 500; }

.compose-hint {
  margin-top: .5rem; font-size: .68rem; line-height: 1.5; color: var(--text-3);
}
.compose-hint.revising { color: var(--amber); }

/* --- commentary ----------------------------------------------------------- */

.commentary { max-width: 46rem; padding: 0 0 6rem; }

.comm-book {
  position: sticky; top: 2.6rem; z-index: 3;
  display: flex; align-items: baseline; gap: .7rem;
  padding: 1.4rem 1.6rem .6rem;
  background: var(--ink-900);
  border-bottom: 1px solid var(--rule);
}
.comm-book h2 {
  margin: 0; font-family: var(--scripture); font-size: 1.5rem; font-weight: 500;
}
.comm-book .btn { margin-left: auto; }

.comm-entry {
  display: grid; grid-template-columns: 4.4rem 1fr;
  gap: 0 1.1rem; padding: 1.3rem 1.6rem;
  border-bottom: 1px solid var(--rule-soft);
}
.comm-ref {
  font-family: var(--code); font-size: .66rem; letter-spacing: .04em;
  color: var(--amber); padding-top: .3rem;
}
.comm-ref button { color: inherit; text-align: left; }
.comm-ref button:hover { color: var(--verdigris); }

.comm-scripture {
  font-family: var(--scripture); font-size: .98rem; line-height: 1.6;
  color: var(--text-2);
  padding-left: .8rem; border-left: 2px solid var(--rule);
  margin-bottom: .85rem;
}
.comm-heading {
  margin: 0 0 .35rem; font-family: var(--scripture);
  font-size: 1.12rem; font-weight: 500; color: var(--text);
}
.comm-body {
  font-family: var(--scripture); font-size: 1rem; line-height: 1.72;
  color: var(--text); white-space: pre-wrap;
}

.comm-gap {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: .6rem;
  padding: .45rem 0 0;
  font-family: var(--code); font-size: .6rem; color: var(--text-3);
}
.comm-gap::before, .comm-gap::after {
  content: ''; flex: 1; height: 1px; background: var(--rule-soft);
}

/* --- coverage ------------------------------------------------------------- */

.coverage { padding: 1.2rem 1.6rem 5rem; }

.cov-book { margin-bottom: 2rem; }
.cov-book h2 {
  margin: 0 0 .2rem; font-family: var(--scripture);
  font-size: 1.3rem; font-weight: 500;
}
.cov-summary {
  font-family: var(--code); font-size: .64rem; color: var(--text-3);
  margin-bottom: .9rem;
}
.cov-summary b { color: var(--verdigris); font-weight: 500; }

.cov-chapter { display: flex; align-items: center; gap: .6rem; margin-bottom: .3rem; }
.cov-chapter .ch {
  font-family: var(--code); font-size: .6rem; color: var(--text-3);
  width: 2rem; text-align: right; flex: none;
}
.cov-cells { display: flex; flex-wrap: wrap; gap: 2px; }
.cov-cell {
  width: 11px; height: 11px; border-radius: 1px;
  background: var(--ink-700); border: none; padding: 0;
  transition: transform .1s var(--ease), background .12s var(--ease);
}
.cov-cell:hover { transform: scale(1.35); }
.cov-cell.done { background: var(--amber); }
.cov-cell.absent { background: transparent; border: 1px solid var(--rule-soft); }

.cov-legend {
  display: flex; gap: 1rem; align-items: center;
  margin-bottom: 1.4rem; font-size: .68rem; color: var(--text-3);
}
.cov-legend span { display: flex; align-items: center; gap: .35rem; }
.cov-legend i { width: 10px; height: 10px; border-radius: 1px; display: inline-block; }

/* --- search --------------------------------------------------------------- */

.search-wrap { padding: 1.1rem 1.6rem 5rem; max-width: 50rem; }

.search-field { display: flex; gap: .5rem; margin-bottom: .5rem; }
.search-field input {
  flex: 1; background: var(--ink-850);
  border: 1px solid var(--rule); border-radius: 3px;
  color: var(--text); padding: .6rem .7rem;
  font-family: var(--ui); font-size: .95rem;
}
.search-field input:focus { border-color: var(--verdigris-dim); outline: none; }

.search-scopes { display: flex; gap: .3rem; margin-bottom: 1.4rem; flex-wrap: wrap; }

.res-group { margin-bottom: 1.9rem; }
.res-group > h3 { margin: 0 0 .6rem; }

.res {
  display: grid; grid-template-columns: 5rem 1fr;
  gap: 0 1rem; padding: .55rem 0;
  border-bottom: 1px solid var(--rule-soft);
}
.res .r-ref {
  font-family: var(--code); font-size: .63rem; color: var(--text-3); padding-top: .15rem;
}
.res .r-ref button { color: var(--verdigris-dim); }
.res .r-ref button:hover { color: var(--verdigris); }
.res .r-text {
  font-family: var(--scripture); font-size: .95rem; line-height: 1.6; color: var(--text-2);
}
.res mark { background: rgba(215,165,72,.22); color: var(--text); border-radius: 2px; }

/* the gap finder — occurrences split by whether you've written on them */
.gapfinder {
  padding: .9rem 1rem; margin-bottom: 1.4rem;
  background: var(--ink-850); border-left: 2px solid var(--verdigris);
  border-radius: 0 3px 3px 0;
}
.gapfinder .headline {
  font-family: var(--scripture); font-size: 1.05rem; margin-bottom: .55rem;
}
.gapfinder .headline .lemma { color: var(--verdigris); font-size: 1.2rem; }
.gapfinder .split { display: flex; gap: 1.6rem; flex-wrap: wrap; }
.gapfinder .col { min-width: 9rem; }
.gapfinder .col > .label { display: block; margin-bottom: .4rem; }
.gapfinder .col.todo > .label { color: var(--rubric); }
.occ-row {
  display: flex; align-items: baseline; gap: .45rem; padding: .16rem 0;
  font-family: var(--code); font-size: .66rem;
}
.occ-row button { color: var(--text-2); }
.occ-row button:hover { color: var(--verdigris); }
.occ-row .form { font-family: var(--scripture); font-size: .9rem; color: var(--text-3); }

@media (max-width: 820px) {
  .wide { grid-column: auto; }
  .comm-entry, .res { grid-template-columns: 1fr; gap: .4rem; }
}

// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------

function parseTokens(verseId) {
  const src = TOKEN_SRC[verseId];
  if (!src) return [];
  const variants = VARIANTS[verseId] || {};
  return src.split(' ~ ').map((chunk, i) => {
    const [surface, strongs, morph, gloss] = chunk.split('|');
    const position = i + 1;
    return {
      verse_id: verseId,
      position,
      surface,
      strongs,
      morph,
      gloss,
      language: 'grc',
      editions: variants[position] || ALL_EDITIONS,
      is_variant: Boolean(variants[position])
    };
  });
}



/* ===== js/corpus.js ===== */
/**
 * CorpusSource — read access to the immutable reference corpus.
 *
 * Two implementations behind one interface:
 *
 *   SeedCorpus     in-memory sample, no network, used for development
 *   SqliteCorpus   the real corpus.db over sql.js-httpvfs (not yet wired)
 *
 * Every method returns a promise even when the seed answers synchronously, so
 * swapping implementations changes nothing in the calling code.
 */


class SeedCorpus {
  get name() { return 'seed'; }

  async books()        { return BOOKS; }
  async translations() { return TRANSLATIONS; }

  /** Verse rows for one translation across an inclusive verse_id range. */
  async verses(translationId, start, end) {
    const table = VERSES[translationId] || {};
    return Object.keys(table)
      .map(Number)
      .filter(id => id >= start && id <= end)
      .sort((a, b) => a - b)
      .map(id => ({ verse_id: id, text: table[id] }));
  }

  async tokens(start, end) {
    const out = [];
    for (let id = start; id <= end; id++) {
      const t = parseTokens(id);
      if (t.length) out.push(...t);
    }
    return out;
  }

  async lexicon(strongs) {
    const entry = LEXICON[strongs];
    return entry ? { strongs, ...entry } : null;
  }

  async crossRefs(verseId) {
    return (CROSS_REFS[verseId] || []).slice().sort((a, b) => b.votes - a.votes);
  }

  async pericopeFor(verseId) {
    return PERICOPES.find(p => verseId >= p.start && verseId <= p.end) || null;
  }

  async pericopes() { return PERICOPES; }

  /** Which passages the seed actually contains — drives the navigator. */
  async availableRanges() {
    return PERICOPES.map(p => ({ ...p }));
  }

  // -- search surfaces -------------------------------------------------------
  //
  // These are what let a search cross between your notes and the text. Because
  // both key on verse_id, "where does this word occur that I have NOT written
  // on" is a set difference, not a heuristic. No study app that licenses its
  // corpus can answer that question — it needs to own both halves.

  /** Every verse_id the corpus has original-language tokens for. */
  async taggedVerses() {
    const ids = [];
    for (const p of PERICOPES) {
      for (let id = p.start; id <= p.end; id++) {
        if (parseTokens(id).length) ids.push(id);
      }
    }
    return ids;
  }

  /** Verse IDs where a Strong's number occurs, with the inflected forms. */
  async occurrencesOf(strongs) {
    const out = [];
    for (const id of await this.taggedVerses()) {
      const hits = parseTokens(id).filter(t => t.strongs === strongs);
      if (hits.length) out.push({ verse_id: id, forms: hits.map(h => h.surface), count: hits.length });
    }
    return out;
  }

  /** Resolve a query to a Strong's number: a code, a lemma, or a gloss. */
  async resolveStrongs(query) {
    const q = query.trim();
    const code = q.toUpperCase().replace(/^([GH])\s*0*(\d+)$/, (_, l, n) => l + String(n).padStart(4, '0'));
    if (LEXICON[code]) return code;
    const lower = q.toLowerCase();
    for (const [s, e] of Object.entries(LEXICON)) {
      if (e.lemma === q || e.translit.toLowerCase() === lower) return s;
    }
    for (const [s, e] of Object.entries(LEXICON)) {
      if (e.short.toLowerCase().includes(lower)) return s;
    }
    return null;
  }

  /** Substring search over local translation text and Greek surface forms. */
  async searchText(query) {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    const hits = [];
    for (const [tid, table] of Object.entries(VERSES)) {
      for (const [idStr, text] of Object.entries(table)) {
        if (text.toLowerCase().includes(q)) {
          hits.push({ verse_id: Number(idStr), translation: tid, text });
        }
      }
    }
    return hits.sort((a, b) => a.verse_id - b.verse_id);
  }

  async lexiconSearch(query) {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    return Object.entries(LEXICON)
      .filter(([s, e]) =>
        s.toLowerCase().includes(q) || e.lemma.includes(query.trim()) ||
        e.translit.toLowerCase().includes(q) || e.short.toLowerCase().includes(q) ||
        e.full.toLowerCase().includes(q))
      .map(([strongs, e]) => ({ strongs, ...e }));
  }

  decodeMorph(code) { return decodeMorph(code); }
}

// ---------------------------------------------------------------------------
// Morphology decoding
// ---------------------------------------------------------------------------

const TENSE = { P: 'present', I: 'imperfect', F: 'future', A: 'aorist', R: 'perfect', L: 'pluperfect', '2A': 'aorist', '2R': 'perfect', '2F': 'future' };
const VOICE = { A: 'active', M: 'middle', P: 'passive', E: 'middle or passive', D: 'deponent', O: 'middle or passive deponent' };
const MOOD  = { I: 'indicative', S: 'subjunctive', O: 'optative', M: 'imperative', N: 'infinitive', P: 'participle' };
const CASE  = { N: 'nominative', G: 'genitive', D: 'dative', A: 'accusative', V: 'vocative' };
const GEND  = { M: 'masculine', F: 'feminine', N: 'neuter' };
const NUM   = { S: 'singular', P: 'plural' };
const POS   = { N: 'noun', V: 'verb', A: 'adjective', T: 'article', P: 'pronoun', R: 'relative pronoun', D: 'demonstrative pronoun', PREP: 'preposition', CONJ: 'conjunction', ADV: 'adverb' };

/**
 * Turn "V-2AAI-3P" into an ordered list of parsed components for the ribbon.
 * Returns [{ label, value }] so the UI never has to know the code grammar.
 */
function decodeMorph(code) {
  if (!code) return [];
  if (POS[code]) return [{ label: 'part of speech', value: POS[code] }];

  const parts = code.split('-');
  const head = parts[0];
  const out = [];

  if (head === 'V') {
    out.push({ label: 'part of speech', value: 'verb' });
    const tvm = parts[1] || '';
    const m = tvm.match(/^(2?[PIFARL])([AMPEDO])([ISOMNP])$/);
    if (m) {
      out.push({ label: 'tense', value: TENSE[m[1]] || m[1] });
      out.push({ label: 'voice', value: VOICE[m[2]] || m[2] });
      out.push({ label: 'mood',  value: MOOD[m[3]]  || m[3] });
      if (m[1].startsWith('2')) out.push({ label: 'form', value: 'second aorist / perfect' });
    }
    const tail = parts[2] || '';
    if (/^[123][SP]$/.test(tail)) {
      out.push({ label: 'person', value: tail[0] + (tail[0] === '1' ? 'st' : tail[0] === '2' ? 'nd' : 'rd') });
      out.push({ label: 'number', value: NUM[tail[1]] });
    } else if (/^[NGDAV][SP][MFN]$/.test(tail)) {
      out.push({ label: 'case',   value: CASE[tail[0]] });
      out.push({ label: 'number', value: NUM[tail[1]] });
      out.push({ label: 'gender', value: GEND[tail[2]] });
    }
    return out;
  }

  if (POS[head]) out.push({ label: 'part of speech', value: POS[head] });
  const decl = parts[1] || '';
  if (/^[NGDAV][SP][MFN]$/.test(decl)) {
    out.push({ label: 'case',   value: CASE[decl[0]] });
    out.push({ label: 'number', value: NUM[decl[1]] });
    out.push({ label: 'gender', value: GEND[decl[2]] });
  }
  return out;
}


/* ===== js/store.js ===== */
/**
 * Store — read/write access to everything you create.
 *
 * The ONLY mutable data in the system: notes, anchors, tags, chains,
 * highlights, lexical annotations.
 *
 *   LocalStore     browser-side persistence for development
 *   CatalystStore  Catalyst Data Store via functions/notes-api (not yet wired)
 *
 * Both satisfy the same interface. app.js never knows which is running.
 */

const KEY = 'workbench:userdata:v1';

/** Pull a readable window of text around the first match. */
function excerpt(text, q, pad = 60) {
  const flat = text.replace(/\s+/g, ' ').trim();
  const at = flat.toLowerCase().indexOf(q);
  if (at === -1) return flat.slice(0, pad * 2);
  const from = Math.max(0, at - pad);
  const to = Math.min(flat.length, at + q.length + pad);
  return (from > 0 ? '\u2026' : '') + flat.slice(from, to) + (to < flat.length ? '\u2026' : '');
}

function emptyState() {
  return { notes: [], anchors: [], tags: [], noteTags: [], seq: 1 };
}

class LocalStore {
  get name() { return 'local'; }

  constructor() {
    this.state = emptyState();
    this.backing = null;
    this.warning = null;
  }

  async init() {
    // Prefer host-provided persistence when present; fall back to session
    // memory rather than failing. Never localStorage.
    if (typeof window !== 'undefined' && window.storage && window.storage.get) {
      this.backing = window.storage;
      try {
        const res = await window.storage.get(KEY);
        if (res && res.value) this.state = JSON.parse(res.value);
      } catch {
        // No key yet. Starting empty is the correct outcome, not an error.
      }
    } else {
      this.warning = 'Notes are held in memory for this session only. They persist once this is deployed to Catalyst.';
    }
    return this;
  }

  async #flush() {
    if (!this.backing) return;
    try {
      await this.backing.set(KEY, JSON.stringify(this.state));
    } catch (err) {
      console.error('Could not save notes:', err);
      throw new Error('Changes were not saved. Check the connection and try again.');
    }
  }

  #id() { return this.state.seq++; }

  // -- notes ---------------------------------------------------------------

  async listNotes() { return this.state.notes.slice(); }

  async notesForRange(start, end) {
    const hits = new Map();
    for (const a of this.state.anchors) {
      if (a.start_verse_id <= end && a.end_verse_id >= start) {
        const note = this.state.notes.find(n => n.note_id === a.note_id);
        if (note && !note.is_archived) {
          if (!hits.has(note.note_id)) hits.set(note.note_id, { ...note, anchors: [] });
          hits.get(note.note_id).anchors.push(a);
        }
      }
    }
    return [...hits.values()];
  }

  async createNote({ note_type, title, body_md, anchors }) {
    const now = new Date().toISOString();
    const note = {
      note_id: this.#id(), note_type,
      title: title || '', body_md: body_md || '',
      is_pinned: 0, is_archived: 0, created_at: now, updated_at: now
    };
    this.state.notes.push(note);
    for (const a of anchors || []) {
      this.state.anchors.push({
        anchor_id: this.#id(), note_id: note.note_id,
        anchor_type: a.anchor_type || 'verse_range',
        start_verse_id: a.start_verse_id, end_verse_id: a.end_verse_id,
        is_primary: a.is_primary ? 1 : 0, label: a.label || null, sort_order: 0
      });
    }
    await this.#flush();
    return note;
  }

  async updateNote(noteId, patch) {
    const note = this.state.notes.find(n => n.note_id === noteId);
    if (!note) throw new Error('That note no longer exists.');
    Object.assign(note, patch, { updated_at: new Date().toISOString() });
    await this.#flush();
    return note;
  }

  async deleteNote(noteId) {
    this.state.notes = this.state.notes.filter(n => n.note_id !== noteId);
    this.state.anchors = this.state.anchors.filter(a => a.note_id !== noteId);
    this.state.noteTags = this.state.noteTags.filter(nt => nt.note_id !== noteId);
    await this.#flush();
  }

  async anchorsForNote(noteId) {
    return this.state.anchors.filter(a => a.note_id === noteId);
  }

  async addAnchor(noteId, anchor) {
    const row = {
      anchor_id: this.#id(), note_id: noteId,
      anchor_type: anchor.anchor_type || 'reference',
      start_verse_id: anchor.start_verse_id, end_verse_id: anchor.end_verse_id,
      is_primary: 0, label: anchor.label || null, sort_order: 0
    };
    this.state.anchors.push(row);
    await this.#flush();
    return row;
  }

  async removeAnchor(anchorId) {
    this.state.anchors = this.state.anchors.filter(a => a.anchor_id !== anchorId);
    await this.#flush();
  }

  /** Verse IDs that carry at least one note — drives the gutter marks. */
  async anchoredVerses(start, end) {
    const set = new Set();
    for (const a of this.state.anchors) {
      const from = Math.max(a.start_verse_id, start);
      const to = Math.min(a.end_verse_id, end);
      for (let id = from; id <= to; id++) set.add(id);
    }
    return set;
  }

  // -- comments ------------------------------------------------------------
  //
  // A "comment" is the canonical annotation on a verse: at most one per verse,
  // keyed by the START verse of its primary anchor. This is the commentary
  // spine. Exposition and document notes are unconstrained and hang off it.
  //
  // The uniqueness is enforced here rather than in the database because
  // Catalyst Data Store has no partial unique indexes. When CatalystStore is
  // implemented, notes-api must enforce the same rule server-side.

  #primaryAnchor(noteId) {
    return this.state.anchors.find(a => a.note_id === noteId && a.is_primary);
  }

  /** The canonical comment on a verse, or null. */
  async getComment(verseId) {
    for (const note of this.state.notes) {
      if (note.note_type !== 'annotation' || note.is_archived) continue;
      const a = this.#primaryAnchor(note.note_id);
      if (a && a.start_verse_id === verseId) return { ...note, anchor: a };
    }
    return null;
  }

  /**
   * Create or replace the comment on a verse. Returns { note, created }.
   * Callers use `created` to tell the difference between writing something
   * new and revising something that was already there.
   */
  async upsertComment(startVerseId, endVerseId, { title, body_md }) {
    const existing = await this.getComment(startVerseId);
    if (existing) {
      const anchor = this.#primaryAnchor(existing.note_id);
      if (anchor) anchor.end_verse_id = endVerseId;
      const note = await this.updateNote(existing.note_id, { title, body_md });
      return { note, created: false };
    }
    const note = await this.createNote({
      note_type: 'annotation', title, body_md,
      anchors: [{ anchor_type: 'verse_range', start_verse_id: startVerseId,
                  end_verse_id: endVerseId, is_primary: true }]
    });
    return { note, created: true };
  }

  /** Every comment in canonical order. This is the commentary. */
  async allComments() {
    const out = [];
    for (const note of this.state.notes) {
      if (note.note_type !== 'annotation' || note.is_archived) continue;
      const a = this.#primaryAnchor(note.note_id);
      if (a) out.push({ ...note, start: a.start_verse_id, end: a.end_verse_id });
    }
    return out.sort((x, y) => x.start - y.start);
  }

  async commentsForBook(bookId) {
    const lo = bookId * 1e6, hi = lo + 999999;
    return (await this.allComments()).filter(c => c.start >= lo && c.start <= hi);
  }

  /** Verse IDs carrying a comment, for the coverage map. */
  async coverage(bookId) {
    const set = new Set();
    for (const c of await this.commentsForBook(bookId)) {
      for (let id = c.start; id <= c.end; id++) set.add(id);
    }
    return set;
  }

  /** Non-comment notes: expositions and standalone documents. */
  async essays() {
    return this.state.notes
      .filter(n => n.note_type !== 'annotation' && !n.is_archived)
      .map(n => ({ ...n, anchors: this.state.anchors.filter(a => a.note_id === n.note_id) }));
  }

  // -- search --------------------------------------------------------------
  //
  // Substring matching over in-memory state. Once corpus.db is live this
  // becomes an FTS5 query — and because notes and corpus share the verse_id
  // key, note search and scripture search can run in ONE statement. Keep the
  // return shape stable so that swap changes nothing upstream.

  async searchNotes(query) {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    const hits = [];
    for (const n of this.state.notes) {
      if (n.is_archived) continue;
      const hay = `${n.title}\n${n.body_md}`.toLowerCase();
      const at = hay.indexOf(q);
      if (at === -1) continue;
      const a = this.#primaryAnchor(n.note_id) ||
                this.state.anchors.find(x => x.note_id === n.note_id);
      hits.push({
        note: n,
        start: a ? a.start_verse_id : null,
        end: a ? a.end_verse_id : null,
        excerpt: excerpt(`${n.title} ${n.body_md}`, q)
      });
    }
    return hits.sort((x, y) => (x.start || 0) - (y.start || 0));
  }

  // -- tags ----------------------------------------------------------------

  async listTags() { return this.state.tags.slice(); }

  async createTag(name, color) {
    const existing = this.state.tags.find(t => t.name.toLowerCase() === name.toLowerCase());
    if (existing) return existing;
    const tag = { tag_id: this.#id(), name, color: color || null,
                  parent_tag_id: null, created_at: new Date().toISOString() };
    this.state.tags.push(tag);
    await this.#flush();
    return tag;
  }

  async tagsForNote(noteId) {
    const ids = this.state.noteTags.filter(nt => nt.note_id === noteId).map(nt => nt.tag_id);
    return this.state.tags.filter(t => ids.includes(t.tag_id));
  }

  async setNoteTags(noteId, tagIds) {
    this.state.noteTags = this.state.noteTags.filter(nt => nt.note_id !== noteId);
    for (const tag_id of tagIds) this.state.noteTags.push({ note_id: noteId, tag_id });
    await this.#flush();
  }

  async notesWithTag(tagId) {
    const ids = this.state.noteTags.filter(nt => nt.tag_id === tagId).map(nt => nt.note_id);
    return this.state.notes.filter(n => ids.includes(n.note_id));
  }
}

/**
 * Production store. Every method here becomes a fetch to
 * functions/notes-api, which does the ZCQL against Data Store.
 *
 * Remember when implementing: Data Store supplies ROWID as the primary key,
 * does not enforce foreign keys, and has no composite primary keys — so
 * cascade deletes and the note_tags uniqueness constraint are this layer's
 * responsibility. See the translation notes in db/userdata_schema.sql.
 */
class CatalystStore {
  get name() { return 'catalyst'; }
  constructor(base = '/server/notes-api') { this.base = base; }
  async init() { throw new Error('CatalystStore is not wired up yet.'); }
}


/* ===== js/app.js ===== */
/**
 * Scripture Workbench — four views over one dataset.
 *
 *   read        three panes: text, exposition, comment
 *   commentary  your comments read straight through, in canonical order
 *   coverage    what you've written on and what you haven't
 *   search      across your notes, the scripture text, and the lexicon
 *
 * All four read through CorpusSource and Store. Swapping SeedCorpus →
 * SqliteCorpus and LocalStore → CatalystStore requires no edits below.
 */




// --- verse id helpers -------------------------------------------------------

const bookOf   = id => BOOKS.find(b => b.book_id === Math.floor(id / 1e6)) || {};
const bookName = id => bookOf(id).name   || '?';
const bookAbbr = id => bookOf(id).abbrev || '?';
const chapterOf = id => Math.floor(id / 1000) % 1000;
const verseOf   = id => id % 1000;

const ref      = id => `${bookName(id)} ${chapterOf(id)}:${verseOf(id)}`;
const shortRef = id => `${bookAbbr(id)} ${chapterOf(id)}:${verseOf(id)}`;

function rangeRef(start, end) {
  if (start === end) return ref(start);
  return chapterOf(start) === chapterOf(end)
    ? `${ref(start)}\u2013${verseOf(end)}`
    : `${ref(start)}\u2013${ref(end)}`;
}

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const $ = id => document.getElementById(id);

function highlight(text, q) {
  const frag = document.createDocumentFragment();
  if (!q) { frag.append(document.createTextNode(text)); return frag; }
  const lower = text.toLowerCase(), needle = q.toLowerCase();
  let i = 0, at;
  while ((at = lower.indexOf(needle, i)) !== -1) {
    if (at > i) frag.append(document.createTextNode(text.slice(i, at)));
    frag.append(el('mark', null, text.slice(at, at + q.length)));
    i = at + q.length;
  }
  frag.append(document.createTextNode(text.slice(i)));
  return frag;
}

// --- state ------------------------------------------------------------------

const state = {
  corpus: null, store: null,
  mode: 'read',
  passage: null,
  versions: ['THGNT', 'KJV'],
  activeToken: null,
  selection: null,
  editing: null,        // note_id being revised, if any
  essayMode: false,
  tagFilter: null,
  translations: [],
  query: ''
};

// --- boot -------------------------------------------------------------------

async function boot() {
  state.corpus = new SeedCorpus();
  state.store  = await new LocalStore().init();
  state.translations = await state.corpus.translations();

  const ranges = await state.corpus.availableRanges();
  state.passage = ranges[0];
  state.ranges = ranges;

  wireModes();
  renderRail();
  await renderMode();
}

function wireModes() {
  for (const btn of $('mode-nav').querySelectorAll('button')) {
    btn.onclick = async () => {
      state.mode = btn.dataset.mode;
      for (const b of $('mode-nav').querySelectorAll('button')) {
        b.setAttribute('aria-current', String(b === btn));
      }
      await renderMode();
    };
  }
}

async function renderMode() {
  const three = $('three-pane'), wide = $('wide-view');
  const reading = state.mode === 'read';
  three.hidden = !reading;
  wide.hidden = reading;
  $('rail-passages').hidden = !reading;

  if (reading) return renderRead();
  if (state.mode === 'commentary') return renderCommentary();
  if (state.mode === 'coverage')   return renderCoverage();
  if (state.mode === 'search')     return renderSearch();
}

async function renderRead() {
  await Promise.all([renderText(), renderExposition(), renderComment()]);
  await renderStat();
}

// --- rail -------------------------------------------------------------------

function renderRail() {
  const list = $('passage-list');
  list.replaceChildren(...state.ranges.map(r => {
    const li = el('li');
    const btn = el('button');
    btn.append(document.createTextNode(r.title));
    btn.append(el('span', 'ref', rangeRef(r.start, r.end)));
    btn.setAttribute('aria-current', String(r === state.passage));
    btn.onclick = async () => {
      state.passage = r;
      state.activeToken = null; state.selection = null; state.editing = null;
      renderRail();
      await renderRead();
    };
    li.append(btn);
    return li;
  }));

  if (state.store.warning) {
    const box = $('store-warning');
    box.textContent = state.store.warning;
    box.hidden = false;
  }
  renderTagCloud();
}

async function renderTagCloud() {
  const tags = await state.store.listTags();
  const wrap = $('tag-cloud');
  if (!tags.length) { wrap.replaceChildren(el('span', 'label', 'none yet')); return; }
  wrap.replaceChildren(...tags.map(t => {
    const b = el('button', 'chip', t.name);
    b.setAttribute('aria-pressed', String(state.tagFilter === t.tag_id));
    b.onclick = async () => {
      state.tagFilter = state.tagFilter === t.tag_id ? null : t.tag_id;
      renderTagCloud();
      await renderMode();
    };
    return b;
  }));
}

async function renderStat() {
  const comments = await state.store.allComments();
  const essays = await state.store.essays();
  const tagged = (await state.corpus.taggedVerses()).length;
  const el2 = $('rail-stat');
  el2.replaceChildren();
  const line = (label, val) => {
    const d = el('div');
    d.append(document.createTextNode(label + ' '));
    d.append(Object.assign(document.createElement('b'), { textContent: String(val) }));
    return d;
  };
  el2.append(line('comments', comments.length));
  el2.append(line('essays', essays.length));
  el2.append(line('verses in corpus', tagged));
}

// --- text pane --------------------------------------------------------------

function renderVersionBar() {
  $('version-bar').replaceChildren(...state.translations.map(t => {
    const b = el('button', null, t.id);
    const on = state.versions.includes(t.id);
    b.setAttribute('aria-pressed', String(on));
    b.title = t.is_local ? t.name : `${t.name} \u2014 fetched live, needs the Catalyst proxy`;
    if (!t.is_local) b.disabled = true;
    b.onclick = async () => {
      state.versions = on ? state.versions.filter(v => v !== t.id) : [...state.versions, t.id];
      await renderText(); renderVersionBar();
    };
    return b;
  }));
}

async function renderText() {
  const { start, end } = state.passage;
  $('text-head').textContent = rangeRef(start, end);
  $('text-count').textContent = `${end - start + 1} vv`;
  renderVersionBar();

  const [tokens, anchored] = await Promise.all([
    state.corpus.tokens(start, end),
    state.store.anchoredVerses(start, end)
  ]);

  const texts = {};
  for (const v of state.versions) {
    texts[v] = Object.fromEntries(
      (await state.corpus.verses(v, start, end)).map(r => [r.verse_id, r.text]));
  }

  const blocks = [];
  for (let id = start; id <= end; id++) {
    const block = el('div', 'verse-block');
    block.dataset.verse = id;
    block.setAttribute('aria-selected', String(
      Boolean(state.selection && id >= state.selection.start && id <= state.selection.end)));

    const row = el('div', 'verse-row');
    const num = el('div', 'verse-num');
    const numBtn = el('button', null, String(verseOf(id)));
    numBtn.title = `Comment on ${ref(id)}`;
    numBtn.onclick = () => selectVerse(id);
    num.append(numBtn);
    if (anchored.has(id)) num.append(el('span', 'anchor-mark'));
    row.append(num);

    const body = el('div', 'verse-body');
    for (const v of state.versions) {
      const trn = state.translations.find(t => t.id === v);
      if (trn && trn.lang === 'grc') {
        const line = el('div', 'line-grc');
        const vt = tokens.filter(t => t.verse_id === id);
        vt.forEach((t, i) => {
          const w = el('span', 'w' + (t.is_variant ? ' variant' : ''), t.surface);
          w.setAttribute('role', 'button');
          w.setAttribute('tabindex', '0');
          w.setAttribute('aria-pressed', String(
            state.activeToken && state.activeToken.verse_id === id &&
            state.activeToken.position === t.position));
          w.title = `${t.gloss} \u00b7 ${t.strongs}`;
          const open = () => openToken(t);
          w.onclick = open;
          w.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
          line.append(w);
          if (i < vt.length - 1) line.append(document.createTextNode(' '));
        });
        if (!vt.length && texts[v] && texts[v][id]) line.textContent = texts[v][id];
        body.append(line);
      } else {
        const line = el('div', 'line-eng');
        line.append(el('span', 'tr', v));
        const t = texts[v] && texts[v][id];
        if (t) line.append(document.createTextNode(t));
        else { line.classList.add('pending'); line.append(document.createTextNode('Not in the seed corpus.')); }
        body.append(line);
      }
    }
    row.append(body);
    block.append(row);

    const ribbon = el('div', 'ribbon');
    ribbon.dataset.for = id;
    ribbon.append(el('div'));
    ribbon.append(el('div', 'ribbon-body'));
    block.append(ribbon);
    blocks.push(block);
  }

  $('text-body').replaceChildren(...blocks);
  if (state.activeToken) paintRibbon();
}

async function selectVerse(id) {
  if (state.selection && state.selection.start === id && state.selection.end === id) {
    state.selection = null;
  } else if (state.selection && id > state.selection.start && !state.essayMode) {
    state.selection = { start: state.selection.start, end: id };
  } else {
    state.selection = { start: id, end: id };
  }
  await renderText();
  await renderComment();
}

// --- word ribbon ------------------------------------------------------------

async function openToken(token) {
  const same = state.activeToken &&
    state.activeToken.verse_id === token.verse_id &&
    state.activeToken.position === token.position;
  state.activeToken = same ? null : token;
  await renderText();
  await renderExposition();
}

async function paintRibbon() {
  const t = state.activeToken;
  if (!t) return;
  const ribbon = document.querySelector(`.ribbon[data-for="${t.verse_id}"]`);
  if (!ribbon) return;

  const entry = await state.corpus.lexicon(t.strongs);
  const body = ribbon.querySelector('.ribbon-body');
  body.replaceChildren();

  const head = el('div', 'ribbon-lemma');
  head.append(el('span', 'lemma', entry ? entry.lemma : t.surface));
  if (entry) head.append(el('span', 'translit', entry.translit));
  head.append(el('span', 'strongs', t.strongs));
  body.append(head);
  body.append(el('div', 'ribbon-gloss', t.gloss));

  const parse = el('div', 'parse');
  const decoded = decodeMorph(t.morph);
  const chips = decoded.length ? decoded : [{ label: 'code', value: t.morph || '\u2014' }];
  for (const d of chips) {
    const chip = el('div', 'parse-chip');
    chip.append(el('span', 'k', d.label));
    chip.append(el('span', 'v', d.value));
    parse.append(chip);
  }
  body.append(parse);

  const ALL = ['THGNT', 'NA28', 'SBLGNT', 'TREG', 'WH', 'TR', 'BYZ'];
  const app = el('div', 'apparatus' + (t.is_variant ? ' split' : ''));
  app.append(el('span', 'label', t.is_variant ? 'editions divide' : 'in all editions'));
  for (const ed of ALL) app.append(el('span', `ed ${t.editions.includes(ed) ? 'present' : 'absent'}`, ed));
  body.append(app);

  const actions = el('div', 'ribbon-actions');
  const noteBtn = el('button', 'mini', 'Comment on this verse');
  noteBtn.onclick = async () => {
    state.selection = { start: t.verse_id, end: t.verse_id };
    await renderText(); await renderComment();
    $('note-body').focus();
  };
  actions.append(noteBtn);
  const traceBtn = el('button', 'mini', `Trace ${t.strongs}`);
  traceBtn.onclick = async () => {
    state.query = t.strongs; state.mode = 'search';
    for (const b of $('mode-nav').querySelectorAll('button'))
      b.setAttribute('aria-current', String(b.dataset.mode === 'search'));
    await renderMode();
  };
  actions.append(traceBtn);
  body.append(actions);

  ribbon.classList.add('open');
}

// --- exposition pane --------------------------------------------------------

async function renderExposition() {
  const pane = $('expo-body');
  const t = state.activeToken;
  const sections = [];

  if (t) {
    const entry = await state.corpus.lexicon(t.strongs);
    const lex = el('section', 'expo-section');
    lex.append(el('h3', 'label', 'lexicon'));
    if (entry) {
      const head = el('div', 'lex-head');
      head.append(el('span', 'lemma', entry.lemma));
      head.append(el('span', 'translit', entry.translit));
      head.append(el('span', 'pos', entry.pos));
      lex.append(head);
      lex.append(el('p', 'lex-short', entry.short));
      lex.append(el('p', 'lex-full', entry.full));
    } else {
      lex.append(el('p', 'lex-full',
        `No entry for ${t.strongs} in the seed lexicon. The full corpus carries the complete extended Strong's set plus LSJ.`));
    }
    sections.push(lex);

    const { start, end } = state.passage;
    const all = await state.corpus.tokens(start, end);
    const others = all.filter(x => x.strongs === t.strongs);
    if (others.length > 1) {
      const occ = el('section', 'expo-section');
      occ.append(el('h3', 'label', `also in this passage \u00b7 ${others.length}`));
      const wrap = el('div', 'occurrences');
      for (const o of others) {
        const b = el('button', 'occ', `${shortRef(o.verse_id)} ${o.surface}`);
        b.onclick = () => openToken(o);
        wrap.append(b);
      }
      occ.append(wrap);
      sections.push(occ);
    }
  }

  const focus = state.selection ? state.selection.start : (t ? t.verse_id : state.passage.start);
  const xrefs = await state.corpus.crossRefs(focus);
  const xs = el('section', 'expo-section');
  xs.append(el('h3', 'label', `cross-references \u00b7 ${ref(focus)}`));
  if (xrefs.length) {
    const ul = el('ul', 'xref-list');
    const max = Math.max(...xrefs.map(x => x.votes));
    for (const x of xrefs) {
      const li = el('li');
      li.append(el('span', 'ref', x.label));
      const w = el('span', 'weight');
      w.style.width = `${Math.round((x.votes / max) * 52) + 6}px`;
      li.append(w);
      li.title = `${x.votes} relevance votes \u00b7 TSK / OpenBible`;
      ul.append(li);
    }
    xs.append(ul);
  } else {
    xs.append(el('p', 'lex-full', 'No references for this verse in the seed set.'));
  }
  sections.push(xs);

  if (!t) {
    const hint = el('section', 'empty');
    hint.append(el('strong', null, 'Open a word'));
    hint.append(document.createTextNode(
      'Click any Greek word for its lexical entry, parsing, and which printed editions carry it. A dotted red underline marks where the editions divide.'));
    sections.unshift(hint);
  }
  pane.replaceChildren(...sections);
}

// --- comment pane -----------------------------------------------------------

async function renderComment() {
  const sel = state.selection;
  const target = $('compose-target');
  const hint = $('compose-hint');
  const save = $('note-save');
  const essayBtn = $('note-essay');

  essayBtn.setAttribute('aria-pressed', String(state.essayMode));
  essayBtn.textContent = state.essayMode ? 'Writing an essay' : 'Essay\u2026';

  if (!sel) {
    target.textContent = 'click a verse number to comment';
    hint.textContent = '';
    hint.className = 'compose-hint';
    save.disabled = true;
    state.editing = null;
  } else if (state.essayMode) {
    target.textContent = `essay linked to ${rangeRef(sel.start, sel.end)}`;
    hint.textContent = 'Essays are standalone. Many can link to the same passage.';
    hint.className = 'compose-hint';
    save.disabled = false;
    save.textContent = 'Save essay';
  } else {
    const existing = await state.store.getComment(sel.start);
    target.textContent = `${rangeRef(sel.start, sel.end)}`;
    save.disabled = false;
    if (existing) {
      state.editing = existing.note_id;
      $('note-title').value = existing.title || '';
      $('note-body').value = existing.body_md || '';
      hint.textContent = 'You have already commented here. Saving revises it.';
      hint.className = 'compose-hint revising';
      save.textContent = 'Revise comment';
    } else {
      state.editing = null;
      hint.textContent = 'One comment per verse. This is the commentary spine.';
      hint.className = 'compose-hint';
      save.textContent = 'Save comment';
    }
  }

  const { start, end } = state.passage;
  let notes = await state.store.notesForRange(start, end);
  if (state.tagFilter) {
    const tagged = await state.store.notesWithTag(state.tagFilter);
    const ids = new Set(tagged.map(n => n.note_id));
    notes = notes.filter(n => ids.has(n.note_id));
  }
  $('notes-count').textContent = String(notes.length);

  const pane = $('notes-body');
  if (!notes.length) {
    const empty = el('div', 'empty');
    empty.append(el('strong', null, 'Nothing written here yet'));
    empty.append(document.createTextNode(
      'Click a verse number, then write. Each comment you save becomes an entry in the commentary.'));
    pane.replaceChildren(empty);
    return;
  }

  const cards = [];
  for (const n of notes.sort((a, b) => b.updated_at.localeCompare(a.updated_at))) {
    const card = el('article', 'note-card');
    const meta = el('div', 'meta');
    meta.append(el('span', 'note-type', n.note_type === 'annotation' ? 'comment' : n.note_type));
    const del = el('button', 'del', 'remove');
    del.onclick = async () => {
      await state.store.deleteNote(n.note_id);
      state.editing = null;
      await renderRead();
    };
    meta.append(del);
    card.append(meta);
    if (n.title) card.append(el('h4', null, n.title));
    if (n.body_md) card.append(el('div', 'body', n.body_md));

    const anchors = el('div', 'anchors');
    for (const a of n.anchors) anchors.append(el('span', 'anchor-pill', rangeRef(a.start_verse_id, a.end_verse_id)));
    for (const t of await state.store.tagsForNote(n.note_id)) anchors.append(el('span', 'chip', t.name));
    card.append(anchors);
    cards.push(card);
  }
  pane.replaceChildren(...cards);
}

async function saveComment() {
  const sel = state.selection;
  if (!sel) return;
  const title = $('note-title').value.trim();
  const body  = $('note-body').value.trim();
  const tagText = $('note-tags').value.trim();
  if (!title && !body) { $('note-body').focus(); return; }

  let noteId;
  if (state.essayMode) {
    const note = await state.store.createNote({
      note_type: 'document', title, body_md: body,
      anchors: [{ anchor_type: 'reference', start_verse_id: sel.start,
                  end_verse_id: sel.end, is_primary: true }]
    });
    noteId = note.note_id;
  } else {
    const { note } = await state.store.upsertComment(sel.start, sel.end, { title, body_md: body });
    noteId = note.note_id;
  }

  if (tagText) {
    const ids = [];
    for (const name of tagText.split(',').map(s => s.trim()).filter(Boolean)) {
      ids.push((await state.store.createTag(name)).tag_id);
    }
    await state.store.setNoteTags(noteId, ids);
  }

  clearCompose();
  state.selection = null;
  state.essayMode = false;
  renderTagCloud();
  await renderRead();
}

function clearCompose() {
  $('note-title').value = '';
  $('note-body').value = '';
  $('note-tags').value = '';
}

// --- commentary view --------------------------------------------------------

async function renderCommentary() {
  $('wide-head').textContent = 'commentary';
  const comments = await state.store.allComments();
  $('wide-count').textContent = `${comments.length} entries`;

  const body = $('wide-body');
  if (!comments.length) {
    const empty = el('div', 'empty');
    empty.append(el('strong', null, 'The commentary is empty'));
    empty.append(document.createTextNode(
      'Comments you write while reading collect here, in canonical order. Go to Read, click a verse number, and write something.'));
    body.replaceChildren(empty);
    return;
  }

  const wrap = el('div', 'commentary');
  let currentBook = null;
  let previous = null;
  const english = state.versions.find(v => {
    const t = state.translations.find(x => x.id === v);
    return t && t.lang === 'eng' && t.is_local;
  }) || 'KJV';

  for (const c of comments) {
    const bid = Math.floor(c.start / 1e6);
    if (bid !== currentBook) {
      currentBook = bid;
      previous = null;
      const head = el('div', 'comm-book');
      head.append(el('h2', null, bookName(c.start)));
      const exp = el('button', 'btn ghost', 'Export markdown');
      exp.onclick = () => exportBook(bid);
      head.append(exp);
      wrap.append(head);
    }

    const entry = el('div', 'comm-entry');

    if (previous !== null && c.start > previous + 1) {
      const gapCount = c.start - previous - 1;
      entry.append(el('div', 'comm-gap',
        `${gapCount} verse${gapCount === 1 ? '' : 's'} without comment`));
    }
    previous = c.end;

    const refCol = el('div', 'comm-ref');
    const jump = el('button', null, rangeRef(c.start, c.end));
    jump.title = 'Open in Read';
    jump.onclick = () => jumpTo(c.start);
    refCol.append(jump);
    entry.append(refCol);

    const main = el('div');
    const rows = await state.corpus.verses(english, c.start, c.end);
    if (rows.length) {
      main.append(el('div', 'comm-scripture', rows.map(r => r.text).join(' ')));
    }
    if (c.title) main.append(el('h3', 'comm-heading', c.title));
    if (c.body_md) main.append(el('div', 'comm-body', c.body_md));

    const tags = await state.store.tagsForNote(c.note_id);
    if (tags.length) {
      const t = el('div', 'anchors');
      for (const tg of tags) t.append(el('span', 'chip', tg.name));
      main.append(t);
    }
    entry.append(main);
    wrap.append(entry);
  }

  body.replaceChildren(wrap);
}

async function jumpTo(verseId) {
  const range = state.ranges.find(r => verseId >= r.start && verseId <= r.end);
  if (range) state.passage = range;
  state.selection = { start: verseId, end: verseId };
  state.mode = 'read';
  for (const b of $('mode-nav').querySelectorAll('button'))
    b.setAttribute('aria-current', String(b.dataset.mode === 'read'));
  renderRail();
  await renderMode();
}

// --- export -----------------------------------------------------------------

/**
 * Markdown export. This is what keeps the commentary yours regardless of what
 * happens to this app, to Catalyst, or to any hosting decision later.
 */
async function exportBook(bookId) {
  const comments = await state.store.commentsForBook(bookId);
  if (!comments.length) return;
  const name = bookName(bookId * 1e6 + 1001);
  const english = 'KJV';

  const lines = [`# Commentary on ${name}`, '',
    `Exported ${new Date().toISOString().slice(0, 10)} \u00b7 ${comments.length} entries`, ''];

  let chapter = null;
  for (const c of comments) {
    if (chapterOf(c.start) !== chapter) {
      chapter = chapterOf(c.start);
      lines.push('', `## ${name} ${chapter}`, '');
    }
    lines.push(`### ${rangeRef(c.start, c.end)}`, '');
    const rows = await state.corpus.verses(english, c.start, c.end);
    if (rows.length) {
      lines.push(`> ${rows.map(r => r.text).join(' ')}`, '', `*${english}*`, '');
    }
    if (c.title) lines.push(`**${c.title}**`, '');
    if (c.body_md) lines.push(c.body_md, '');
    const tags = await state.store.tagsForNote(c.note_id);
    if (tags.length) lines.push(`\`${tags.map(t => t.name).join('\u2003')}\``, '');
  }

  const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `commentary-${name.toLowerCase().replace(/\s+/g, '-')}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// --- coverage view ----------------------------------------------------------

async function renderCoverage() {
  $('wide-head').textContent = 'coverage';
  const body = $('wide-body');
  const wrap = el('div', 'coverage');

  const legend = el('div', 'cov-legend');
  const item = (cls, text) => {
    const s = el('span');
    const i = el('i');
    i.className = cls;
    i.style.background = cls === 'done' ? 'var(--amber)' : 'var(--ink-700)';
    s.append(i, document.createTextNode(text));
    return s;
  };
  legend.append(item('done', 'commented'), item('', 'in corpus, not yet written on'));
  wrap.append(legend);

  const comments = await state.store.allComments();
  const booksTouched = [...new Set(state.ranges.map(r => Math.floor(r.start / 1e6)))];
  $('wide-count').textContent = `${comments.length} of ${(await state.corpus.taggedVerses()).length} verses`;

  for (const bid of booksTouched) {
    const book = BOOKS.find(b => b.book_id === bid);
    const covered = await state.store.coverage(bid);
    const inCorpus = (await state.corpus.taggedVerses()).filter(v => Math.floor(v / 1e6) === bid);

    const sec = el('section', 'cov-book');
    sec.append(el('h2', null, book.name));
    const done = inCorpus.filter(v => covered.has(v)).length;
    const pct = inCorpus.length ? Math.round((done / inCorpus.length) * 100) : 0;
    const sum = el('div', 'cov-summary');
    sum.append(Object.assign(document.createElement('b'), { textContent: `${done}` }));
    sum.append(document.createTextNode(` of ${inCorpus.length} verses in the corpus \u00b7 ${pct}%`));
    sec.append(sum);

    const chapters = [...new Set(inCorpus.map(chapterOf))].sort((a, b) => a - b);
    for (const ch of chapters) {
      const row = el('div', 'cov-chapter');
      row.append(el('span', 'ch', String(ch)));
      const cells = el('div', 'cov-cells');
      const verses = inCorpus.filter(v => chapterOf(v) === ch).sort((a, b) => a - b);
      for (const v of verses) {
        const c = el('button', 'cov-cell' + (covered.has(v) ? ' done' : ''));
        c.title = `${ref(v)} \u2014 ${covered.has(v) ? 'commented' : 'not yet'}`;
        c.onclick = () => jumpTo(v);
        cells.append(c);
      }
      row.append(cells);
      sec.append(row);
    }
    wrap.append(sec);
  }

  const note = el('div', 'empty');
  note.append(el('strong', null, 'Reading this map'));
  note.append(document.createTextNode(
    'Only verses the corpus actually contains are shown. Once the full corpus is built this becomes a map of the whole canon, and the empty cells are your working queue.'));
  wrap.append(note);

  body.replaceChildren(wrap);
}

// --- search view ------------------------------------------------------------

async function renderSearch() {
  $('wide-head').textContent = 'search';
  const body = $('wide-body');
  const wrap = el('div', 'search-wrap');

  const field = el('div', 'search-field');
  const input = el('input');
  input.type = 'search';
  input.placeholder = 'A word, a phrase, a Strong\u2019s number, a lemma\u2026';
  input.value = state.query;
  field.append(input);
  wrap.append(field);

  const results = el('div');
  wrap.append(results);
  body.replaceChildren(wrap);

  let timer;
  const run = async () => {
    state.query = input.value;
    await paintResults(results, state.query);
  };
  input.oninput = () => { clearTimeout(timer); timer = setTimeout(run, 140); };
  input.onkeydown = e => { if (e.key === 'Enter') { clearTimeout(timer); run(); } };

  input.focus();
  await paintResults(results, state.query);
}

async function paintResults(container, query) {
  const q = query.trim();
  container.replaceChildren();
  $('wide-count').textContent = '';

  if (!q) {
    const empty = el('div', 'empty');
    empty.append(el('strong', null, 'Search across everything at once'));
    empty.append(document.createTextNode(
      'Your comments, the scripture text, and the lexicon share one key, so a search can cross between them. Try a Strong\u2019s number like G2435, a lemma, or a phrase from something you wrote.'));
    container.append(empty);
    return;
  }

  let total = 0;

  // The gap finder — the query this whole design exists to make possible.
  const strongs = await state.corpus.resolveStrongs(q);
  if (strongs) {
    const entry = await state.corpus.lexicon(strongs);
    const occs = await state.corpus.occurrencesOf(strongs);
    const written = [], todo = [];
    for (const o of occs) {
      const c = await state.store.getComment(o.verse_id);
      (c ? written : todo).push(o);
    }

    const gf = el('div', 'gapfinder');
    const head = el('div', 'headline');
    head.append(el('span', 'lemma', entry ? entry.lemma : strongs));
    head.append(document.createTextNode(
      ` \u00b7 ${strongs} \u00b7 ${occs.length} occurrence${occs.length === 1 ? '' : 's'} in the corpus`));
    gf.append(head);

    const split = el('div', 'split');
    const col = (title, list, cls) => {
      const c = el('div', 'col' + (cls ? ' ' + cls : ''));
      c.append(el('span', 'label', `${title} \u00b7 ${list.length}`));
      if (!list.length) c.append(el('div', 'occ-row', '\u2014'));
      for (const o of list) {
        const row = el('div', 'occ-row');
        const b = el('button', null, shortRef(o.verse_id));
        b.onclick = () => jumpTo(o.verse_id);
        row.append(b);
        row.append(el('span', 'form', o.forms.join(', ')));
        c.append(row);
      }
      return c;
    };
    split.append(col('written on', written));
    split.append(col('not yet', todo, 'todo'));
    gf.append(split);
    container.append(gf);
    total += occs.length;
  }

  const noteHits = await state.store.searchNotes(q);
  if (noteHits.length) {
    const g = el('div', 'res-group');
    g.append(el('h3', 'label', `your notes \u00b7 ${noteHits.length}`));
    for (const h of noteHits) {
      const r = el('div', 'res');
      const rc = el('div', 'r-ref');
      if (h.start) {
        const b = el('button', null, rangeRef(h.start, h.end));
        b.onclick = () => jumpTo(h.start);
        rc.append(b);
      } else rc.append(document.createTextNode('\u2014'));
      r.append(rc);
      const txt = el('div', 'r-text');
      txt.append(highlight(h.excerpt, q));
      r.append(txt);
      g.append(r);
    }
    container.append(g);
    total += noteHits.length;
  }

  const textHits = await state.corpus.searchText(q);
  if (textHits.length) {
    const g = el('div', 'res-group');
    g.append(el('h3', 'label', `scripture \u00b7 ${textHits.length}`));
    for (const h of textHits.slice(0, 40)) {
      const r = el('div', 'res');
      const rc = el('div', 'r-ref');
      const b = el('button', null, shortRef(h.verse_id));
      b.onclick = () => jumpTo(h.verse_id);
      rc.append(b);
      rc.append(el('div', null, h.translation));
      r.append(rc);
      const txt = el('div', 'r-text');
      txt.append(highlight(h.text, q));
      r.append(txt);
      g.append(r);
    }
    container.append(g);
    total += textHits.length;
  }

  const lexHits = await state.corpus.lexiconSearch(q);
  if (lexHits.length) {
    const g = el('div', 'res-group');
    g.append(el('h3', 'label', `lexicon \u00b7 ${lexHits.length}`));
    for (const h of lexHits.slice(0, 15)) {
      const r = el('div', 'res');
      const rc = el('div', 'r-ref');
      const b = el('button', null, h.strongs);
      b.onclick = async () => {
        const input = document.querySelector('.search-field input');
        if (input) { input.value = h.strongs; state.query = h.strongs; }
        await paintResults(container, h.strongs);
      };
      rc.append(b);
      r.append(rc);
      const txt = el('div', 'r-text');
      txt.append(el('span', 'lemma', h.lemma + ' \u2014 '));
      txt.append(highlight(h.short, q));
      r.append(txt);
      g.append(r);
    }
    container.append(g);
    total += lexHits.length;
  }

  $('wide-count').textContent = total ? `${total} results` : '';

  if (!total) {
    const empty = el('div', 'empty');
    empty.append(el('strong', null, 'Nothing found'));
    empty.append(document.createTextNode(
      'The seed corpus covers Romans 3:21\u201326 and John 1:1\u20135. The full corpus will search the whole canon.'));
    container.append(empty);
  }
}

// --- wiring -----------------------------------------------------------------

document.addEventListener('DOMContentLoaded', () => {
  $('note-save').onclick = saveComment;
  $('note-clear').onclick = async () => {
    state.selection = null; state.editing = null; state.essayMode = false;
    clearCompose();
    await renderText(); await renderComment();
  };
  $('note-essay').onclick = async () => {
    state.essayMode = !state.essayMode;
    clearCompose();
    await renderComment();
  };

  boot().catch(err => {
    console.error(err);
    $('text-body').replaceChildren(Object.assign(document.createElement('div'), {
      className: 'empty',
      textContent: `The workbench could not start: ${err.message}`
    }));
  });
});

})();
